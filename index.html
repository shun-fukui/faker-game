<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Faker!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-top: 20px; }
        p { margin-bottom: 20px; color: #ecf0f1; }

        /* The Game Board Grid */
        #game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 columns */
            gap: 15px;
            max-width: 800px;
            padding: 20px;
        }

        /* The Bush Container */
        .bush-container {
            position: relative;
            width: 80px;
            height: 80px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* The Bush Visual */
        .bush {
            width: 80px;      /* <--- ADD THIS */
            height: 80px;
            position: relative;
            z-index: 2; /* In front of Faker */
            transition: transform 0.1s;
        }

        .bush:active {
            transform: scale(0.9);
        }

        /* Faker Image Styles */
        .faker {
            position: absolute;
            bottom: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid gold;
            z-index: 1; /* Behind the bush */
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease-in-out;
        }

        /* Animation class to reveal Faker */
        .reveal .faker {
            opacity: 1;
            transform: translateY(-40px); /* Pop up above bush */
            z-index: 3; /* Move in front of bush */
        }

        /* Animation for shaking the bush (Wrong guess) */
        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

    </style>
</head>
<body>

    <h1>Find Hide on Bush</h1>
    <p>Click a bush to find the Unkillable Demon King</p>
    <h3 id="status">Hiding...</h3>

    <div id="game-board">
        </div>

    <script>
        // 1. Configuration //test
        const totalBushes = 20;
        const gameBoard = document.getElementById('game-board');
        const statusText = document.getElementById('status');
        
        // REPLACE THIS URL with a real image of Faker if you want
        const fakerImgUrl = "Faker_2020_interview.jpg"; // Placeholder image URL

        let fakerPosition = -1;
        let isRevealing = false; // Prevents clicking while he is moving

        // 2. Initialize Game
        function initGame() {
            gameBoard.innerHTML = ''; // Clear board
            
            // Generate Bushes
            for (let i = 0; i < totalBushes; i++) {
                const container = document.createElement('div');
                container.classList.add('bush-container');
                container.dataset.index = i;
                container.onclick = () => checkBush(i);

                // Create the Bush (Emoji)
                const bush = document.createElement('img'); // Change 'div' to 'img'
                bush.src = "bush.png"; // <--- PUT YOUR IMAGE NAME HERE
                bush.classList.add('bush');

                // Create Faker (Hidden Image)
                const img = document.createElement('img');
                img.src = fakerImgUrl;
                img.classList.add('faker');
                img.id = `faker-${i}`;

                container.appendChild(bush);
                container.appendChild(img);
                gameBoard.appendChild(container);
            }

            // Pick random spot
            placeFaker();
        }

        function placeFaker() {
            fakerPosition = Math.floor(Math.random() * totalBushes);
            console.log("Faker is at bush index:", fakerPosition); // For debugging
        }

        // 3. Game Logic
        function checkBush(clickedIndex) {
            if (isRevealing) return; // Ignore clicks during animation

            const clickedBush = gameBoard.children[clickedIndex].querySelector('.bush');

            if (clickedIndex === fakerPosition) {
                // --- WIN CONDITION ---
                const correctContainer = gameBoard.children[fakerPosition];
                correctContainer.classList.add('reveal');
                statusText.innerText = "Legends Never Die";
                statusText.style.color = "#2ecc71";
                
                setTimeout(() => {
                    alert("You found Faker! Starting new round.");
                    correctContainer.classList.remove('reveal');
                    statusText.innerText = "Hiding...";
                    statusText.style.color = "#ecf0f1";
                    placeFaker();
                }, 500);

            } else {
                // --- LOSE/MISS CONDITION ---
                isRevealing = true;
                statusText.innerText = "Faker Calling...";
                statusText.style.color = "#e74c3c";

                // 1. Shake the wrong bush
                clickedBush.classList.add('shake');

                // 2. Reveal where he ACTUALLY was
                const actualContainer = gameBoard.children[fakerPosition];
                actualContainer.classList.add('reveal');

                // 3. Wait, then hide him and move him
                setTimeout(() => {
                    actualContainer.classList.remove('reveal');
                    clickedBush.classList.remove('shake');
                    statusText.innerText = "He moved! Try again.";
                    
                    // Move Faker to a NEW spot
                    placeFaker();
                    isRevealing = false;
                }, 1200); // 1.2 seconds delay
            }
        }

        // Start the game on load
        initGame();

    </script>
</body>
</html>
